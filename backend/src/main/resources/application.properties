spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/ragdocqa
spring.datasource.username=ragdocqa
spring.datasource.password=ragdocqa

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

app.storage.upload-dir=uploads

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3
spring.ai.ollama.chat.model=qwen3.5:9b

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=doc-processor-

